<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 15%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; top: 70%; left: 80%; animation-delay: 3s; }
        .particle:nth-child(3) { width: 60px; height: 60px; top: 40%; left: 5%; animation-delay: 6s; }
        .particle:nth-child(4) { width: 100px; height: 100px; top: 80%; left: 20%; animation-delay: 9s; }
        .particle:nth-child(5) { width: 50px; height: 50px; top: 15%; left: 70%; animation-delay: 12s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-40px) translateX(20px); }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 580px;
            width: 100%;
            padding: 60px 45px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardIn 0.8s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-wrap {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
            animation: pulse 2.5s ease-in-out infinite;
            position: relative;
        }

        .icon-wrap::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            opacity: 0.4;
            animation: ring 2.5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes ring {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a8b8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            height: 3px;
            width: 70px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 25px;
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .main-msg {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .sub-msg {
            color: #b8b8d0;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .safe-box {
            background: rgba(76, 175, 80, 0.12);
            border: 1px solid rgba(76, 175, 80, 0.35);
            border-left: 4px solid #4caf50;
            border-radius: 12px;
            padding: 16px 22px;
            margin-bottom: 25px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.8s ease-out 0.3s both;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .check-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .safe-box p {
            color: #a5d6a7;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 600;
            margin: 0;
        }

        .footer-text {
            color: #6a6a8a;
            font-size: 12px;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .card { padding: 45px 25px; }
            h1 { font-size: 26px; }
            .main-msg { font-size: 18px; }
            .icon-wrap { width: 90px; height: 90px; font-size: 45px; }
        }
    </style>
</head>
<body>

    <!-- Floating particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="card">

        <!-- Icon -->
        <div class="icon-wrap">🛠️</div>

        <!-- Heading -->
        <h1>Website Under Maintenance</h1>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Main Message -->
        <p class="main-msg">Please Wait 1-2 Hours ⏳</p>

        <p class="sub-msg">
            The website is down for a short while right now.<br>
            Some updates are in progress. Please come back in a little while!
        </p>


        <!-- Footer -->
        <p class="footer-text">© 2026 Your Website. All rights reserved.</p>

    </div>

</body>
</html>
